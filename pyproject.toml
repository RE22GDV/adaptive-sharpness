[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-sharpness"
version = "1.0.0"
description = "Real-time no-reference focus evaluation: six focus-measure families with adaptive weighting, confidence estimation and a spatial sharpness map"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "autofocus",
    "sharpness",
    "focus-measure",
    "no-reference",
    "computer-vision",
    "raspberry-pi",
    "opencv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]

# The library core needs nothing but these two.
#
# Both bounds on OpenCV are load-bearing:
#
#   >=4.10  the first release with wheels built against NumPy 2. Declaring
#           `opencv-python>=4.8` together with `numpy>=1.24` let a resolver pick
#           OpenCV 4.8 with NumPy 2, which fails at import with
#           "AttributeError: _ARRAY_API not found". CI caught it.
#   <5      on 5.0 a substantial part of the suite fails, largely because
#           CascadeClassifier is no longer available where this code expects it.
#
# Older OpenCV still works if NumPy is pinned back with it; the CI matrix keeps
# one such legacy pair green.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
# PTP live view (Panasonic GH6 and other PTP cameras over USB).
# On Raspberry Pi OS prefer the system package: sudo apt install python3-gphoto2
camera = ["gphoto2>=2.3"]
# Figure generation for the documentation.
figures = ["matplotlib>=3.5"]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
]

# No console_scripts are declared on purpose. The research tools in tools/ and
# the UI in demo/ are repository scripts, not part of the installed library, so
# an entry point pointing at them would resolve to a module the wheel does not
# contain. Run them from a checkout instead: python3 tools/benchmark.py

[project.urls]
Homepage = "https://github.com/RE22GDV/adaptive-sharpness"
Repository = "https://github.com/RE22GDV/adaptive-sharpness"
Issues = "https://github.com/RE22GDV/adaptive-sharpness/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_sharpness = ["py.typed", "data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No addopts: a -q here would stack with a -q on the command line and suppress
# the summary line entirely.
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 92
target-version = "py311"
src = ["src", "tools", "demo", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
