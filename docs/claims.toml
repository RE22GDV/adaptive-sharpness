# Numbers quoted in prose, pinned to the report that produced them.
#
# Every figure a document states in a sentence or a hand-written table is
# registered here with the report it came from, the field it is, and - this is
# the point of the file - how many recordings it was averaged over.
#
# This exists because of a specific defect.  `docs/CALIBRATION.md` printed a
# table headed "across all eight recordings" whose plateau column held
# `peak_plateau`, a statistic defined only on the two recordings that carry the
# point-source reference.  The generated `docs/RESULTS.md` had it right; the
# hand-written summary of it did not, and the wrong number was repeated
# downstream.  Nothing checked the two against each other.
#
# `tests/test_claims.py` now does.  A claim whose value has moved fails and
# names the document to fix; a claim that cites `n` wrongly fails even when the
# value is right.
#
#   id      stable name, cited from the documents that use it
#   report  file in reports/, without the .json
#   variant key under "aggregate"
#   field   key under that variant
#   n       recordings the field was averaged over; checked against <field>_n
#   value   what the documents say, at the precision they say it
#   digits  decimal places the documents round to
#   where   documents that quote it, so a failure names them

[[claim]]
id = "singles.six.adj"
report = "ablation_singles"
variant = "six_shipped"
field = "adj"
n = 8
value = 0.822
digits = 3
where = ["docs/CALIBRATION.md", "docs/STUDY_UA.md", "docs/STUDY_UA_REPORT.md"]

